services:
  mediareducer:
    build: .
    container_name: mediareducer
    ports:
      # Host side only, so the container port stays 7474 and its health check
      # keeps working. Set WEBUI_PORT in .env if 7474 is taken on this host.
      - "${WEBUI_PORT:-7474}:7474"    # web UI — http://your-server-ip:${WEBUI_PORT:-7474}
    volumes:
      - ${PLEX_LIBRARY_PATH}:/library:rw             # shared movie library mount (file deletion)
      - ${TAUTULLI_APPDATA}:/tautulli:ro             # optional: lets Auto Detect read the Tautulli API key + Plex token
      - ${RADARR_APPDATA}:/radarr:ro                 # optional: lets Auto Detect read the Radarr API key
      # Defaulted so an .env without SONARR_APPDATA still composes.
      - ${SONARR_APPDATA:-/mnt/user/appdata/sonarr}:/sonarr:ro   # optional: lets Auto Detect read the Sonarr API key
      # The fallback below is an UNRAID default — set the var in .env on any
      # other host, or Docker will create /mnt/user/appdata/... for you.
      - ${MEDIAREDUCER_DATA:-/mnt/user/appdata/mediareducer/config}:/config  # persistent config/logs/cache
    environment:
      - PYTHONUNBUFFERED=1
      # Run as a specific user instead of root (optional — works on any host).
      # The mapped user needs write access to your movie files and /config.
      # Unraid: 99/100 = nobody:users. Other Linux hosts: your own user's ids
      # (`id -u` / `id -g`, commonly 1000/1000).
      # - PUID=99
      # - PGID=100
      # Accessing the UI through a reverse-proxy domain? List it here,
      # comma-separated — unknown Host headers are rejected (DNS-rebinding guard).
      # - MEDIAREDUCER_TRUSTED_HOSTS=media.example.com
    init: true               # reap engine subprocesses cleanly + forward SIGTERM to the app
    # On stop, the app forwards SIGTERM to an in-flight run and waits ~8s for the
    # engine to finish its current file (unlink → deleted.log) before exiting.
    # Keep the grace comfortably above that so a clean finish is never cut short.
    stop_grace_period: 30s
    restart: unless-stopped
